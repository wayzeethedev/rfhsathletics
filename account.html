<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wiley Bucks</title>

  <link rel="manifest" href="manifest.json">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      background: #f6f7fb;
      color: #222;
      min-height: 100vh;
      padding: 32px 20px calc(90px + env(safe-area-inset-bottom));
    }

    h1 {
      font-size: 28px;
      margin-bottom: 24px;
    }

    .account {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .pfp-pic {
      display: block;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 0 16px 0;
    }

    h2 {
      text-align: center;
      margin-top: 4px;
      font-size: 22px;
    }

    h4 {
      text-align: center;
      margin-top: 6px;
      color: #777;
      font-size: 14px;
      font-weight: 400;
    }

    .account-info {
      background: #fff;
      border-radius: 16px;
      margin-top: 28px;
      padding: 4px 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .05);
      text-align: left;
    }

    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #777;
      font-size: .85rem;
    }

    .info-value {
      font-size: .85rem;
      font-weight: 600;
      max-width: 60%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .logout-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: #222;
      color: #fff;
      font-family: Inter, sans-serif;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: .15s ease;
    }

    .logout-btn:hover {
      background: #333;
    }

    .logout-btn:active {
      transform: scale(.99);
    }

    .logout-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .nav-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: calc(env(safe-area-inset-bottom) - 12px);
      background: #fff;
      border-top: 1px solid #e9e9e9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
    }

    .nav-item {
      flex: 1;
      height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: #777;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #5B2D90;
    }

    .nav-item .material-symbols-outlined {
      font-size: 24px;
    }

    .nav-item span:last-child {
      font-size: .72rem;
      font-weight: 600;
    }
  </style>

</head>

<body>

  <h1>Account</h1>

  <div class="account">

    <img class="pfp-pic" id="profilePicture" src="" alt="Profile Picture">

    <h2 id="accountName">
      Loading...
    </h2>

    <h4 id="accountEmail">
      Loading...
    </h4>

  </div>

  <div class="account-info">

    <div class="info-row">
      <span class="info-label">
        Name
      </span>

      <span class="info-value" id="nameValue">
        Loading...
      </span>
    </div>

    <div class="info-row">
      <span class="info-label">
        Email
      </span>

      <span class="info-value" id="emailValue">
        Loading...
      </span>
    </div>

  </div>

  <button class="logout-btn" id="logoutBtn">
    Sign Out
  </button>

  <nav class="nav-bar">

    <a href="index.html" class="nav-item">
      <span class="material-symbols-outlined">
        home
      </span>

      <span>
        Home
      </span>
    </a>

    <a href="shop.html" class="nav-item">
      <span class="material-symbols-outlined">
        shopping_bag
      </span>

      <span>
        Prizes
      </span>
    </a>

    <a href="checkin.html" class="nav-item">
      <span class="material-symbols-outlined">
        qr_code_scanner
      </span>

      <span>
        Check In
      </span>
    </a>

    <a href="leaderboard.html" class="nav-item">
      <span class="material-symbols-outlined">
        leaderboard
      </span>

      <span>
        Leaderboard
      </span>
    </a>

    <a href="account.html" class="nav-item active">
      <span class="material-symbols-outlined">
        person
      </span>

      <span>
        Account
      </span>
    </a>

  </nav>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4ZMuE3-l-PwTQlPvLpykFzUvk7QDF9Z0",
      authDomain: "wileybucks.firebaseapp.com",
      projectId: "wileybucks",
      storageBucket: "wileybucks.firebasestorage.app",
      messagingSenderId: "1037519230312",
      appId: "1:1037519230312:web:b6ed0297b5d677808972dd",
      measurementId: "G-E81C7PYNC7"
    };

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const profilePicture =
      document.getElementById("profilePicture");

    const accountName =
      document.getElementById("accountName");

    const accountEmail =
      document.getElementById("accountEmail");

    const nameValue =
      document.getElementById("nameValue");

    const emailValue =
      document.getElementById("emailValue");

    const logoutBtn =
      document.getElementById("logoutBtn");

    /* FALLBACK PROFILE IMAGE */

    function createFallbackAvatar(name) {

      const initials = name
        .trim()
        .split(/\s+/)
        .map(word => word.charAt(0))
        .slice(0, 2)
        .join("")
        .toUpperCase();

      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="250"
                height="250"
                viewBox="0 0 250 250"
            >
                <rect
                    width="250"
                    height="250"
                    rx="125"
                    fill="#5B2D90"
                />

                <text
                    x="50%"
                    y="50%"
                    dominant-baseline="middle"
                    text-anchor="middle"
                    fill="white"
                    font-family="Arial, sans-serif"
                    font-size="88"
                    font-weight="700"
                >
                    ${initials || "W"}
                </text>
            </svg>
        `)}`;
    }

    /* USER */

    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {
          return;
        }

        const name =
          user.displayName ||
          "Wildcat";

        const email =
          user.email ||
          "";

        const fallbackAvatar =
          createFallbackAvatar(name);

        if (user.photoURL) {

          profilePicture.src =
            user.photoURL;

        } else {

          profilePicture.src =
            fallbackAvatar;
        }

        profilePicture.onerror = () => {

          profilePicture.onerror = null;

          profilePicture.src =
            fallbackAvatar;
        };

        profilePicture.alt =
          `${name}'s profile picture`;

        accountName.textContent =
          name;

        accountEmail.textContent =
          email;

        nameValue.textContent =
          name;

        emailValue.textContent =
          email;

      }
    );

    /* SIGN OUT */

    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled = true;

        logoutBtn.textContent =
          "Signing Out...";

        try {

          await signOut(auth);

          window.location.replace(
            "/index.html"
          );

        } catch (error) {

          console.error(
            "Sign out failed:",
            error
          );

          logoutBtn.disabled = false;

          logoutBtn.textContent =
            "Sign Out";
        }

      }
    );
  </script>

  <script type="module" src="/auth.js"></script>

</body>

</html>
