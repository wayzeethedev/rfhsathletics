<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Wiley Bucks">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5B2D90">
  <title>Wiley Bucks - Check In</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }

    body {
      background: #f6f7fb;
      color: #222;
      padding: 20px 20px calc(70px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    .checkin-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .qr-container {
      width: min(320px, calc(100vw - 40px));
      aspect-ratio: 1 / 1;
      background: #fff;
      padding: 16px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .05);
      flex-shrink: 0;
    }

    .qr-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      pointer-events: none;
    }

    .student-name {
      text-align: center;
      margin-top: 12px;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .student-email {
      text-align: center;
      margin-top: 2px;
      color: #777;
      font-size: .8rem;
      flex-shrink: 0;
    }

    .qr-label {
      margin-top: 10px;
      text-align: center;
      color: #777;
      font-size: .75rem;
      line-height: 1.4;
      max-width: 320px;
      flex-shrink: 0;
    }

    .error {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      background: #fff0f0;
      color: #c62828;
      border-radius: 12px;
      text-align: center;
      font-size: .8rem;
      flex-shrink: 0;
    }

    .error.show {
      display: block;
    }

    .nav-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: calc(env(safe-area-inset-bottom) - 12px);
      background: #fff;
      border-top: 1px solid #e9e9e9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, .06);
      z-index: 100;
      touch-action: manipulation;
    }

    .nav-item {
      flex: 1;
      height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: #777;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-item:hover,
    .nav-item.active {
      color: #5B2D90;
    }

    .nav-item .material-symbols-outlined {
      font-size: 24px;
      pointer-events: none;
    }

    .nav-item span:last-child {
      font-size: .72rem;
      font-weight: 600;
      pointer-events: none;
    }

    input,
    button,
    textarea,
    select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    a {
      text-decoration: none;
      touch-action: manipulation;
    }

    img {
      pointer-events: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 16px calc(65px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 22px;
        margin-bottom: 12px;
      }

      .qr-container {
        width: min(260px, calc(100vw - 32px));
        padding: 12px;
        border-radius: 20px;
      }

      .student-name {
        font-size: 18px;
        margin-top: 10px;
      }

      .qr-label {
        font-size: .7rem;
        margin-top: 8px;
      }
    }

    @media (max-height: 700px) {
      .qr-container {
        width: min(220px, calc(100vw - 40px));
        padding: 12px;
      }

      .student-name {
        font-size: 17px;
        margin-top: 8px;
      }

      .qr-label {
        font-size: .7rem;
        margin-top: 6px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 10px;
      }
    }

    @media (max-height: 600px) {
      .qr-container {
        width: min(180px, calc(100vw - 40px));
        padding: 10px;
        border-radius: 16px;
      }

      .student-name {
        font-size: 15px;
        margin-top: 6px;
      }

      .student-email {
        font-size: .7rem;
      }

      .qr-label {
        display: none;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body>

  <h1>Check In</h1>

  <main class="checkin-content">
    <div class="qr-container">
      <img id="studentQr" alt="Your Wiley Bucks QR Code" draggable="false">
    </div>

    <h2 class="student-name" id="studentName">Loading...</h2>
    <p class="student-email" id="studentEmail">Loading...</p>
    <p class="qr-label">Show this QR code to an event administrator to check in and earn Wiley Bucks.</p>
    <div class="error" id="errorMessage"></div>
  </main>

  <nav class="nav-bar">
    <a href="index.html" class="nav-item">
      <span class="material-symbols-outlined">home</span>
      <span>Home</span>
    </a>
    <a href="prizes.html" class="nav-item">
      <span class="material-symbols-outlined">shopping_bag</span>
      <span>Prizes</span>
    </a>
    <a href="checkin.html" class="nav-item active">
      <span class="material-symbols-outlined">qr_code_scanner</span>
      <span>Check In</span>
    </a>
    <a href="leaderboard.html" class="nav-item">
      <span class="material-symbols-outlined">leaderboard</span>
      <span>Leaderboard</span>
    </a>
    <a href="account.html" class="nav-item">
      <span class="material-symbols-outlined">person</span>
      <span>Account</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4ZMuE3-l-PwTQlPvLpykFzUvk7QDF9Z0",
      authDomain: "wileybucks.firebaseapp.com",
      projectId: "wileybucks",
      storageBucket: "wileybucks.firebasestorage.app",
      messagingSenderId: "1037519230312",
      appId: "1:1037519230312:web:b6ed0297b5d677808972dd",
      measurementId: "G-E81C7PYNC7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const studentQr = document.getElementById("studentQr");
    const studentName = document.getElementById("studentName");
    const studentEmail = document.getElementById("studentEmail");
    const errorMessage = document.getElementById("errorMessage");

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add("show");
    }

    function generateQrCode(uid) {
      const qrData = `WILEY:${uid}`;
      const encodedData = encodeURIComponent(qrData);
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=20&data=${encodedData}`;
      studentQr.src = qrUrl;
      studentQr.onerror = () => {
        showError("Unable to load your QR code. Please check your internet connection.");
      };
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.replace("/index.html");
        return;
      }

      const email = (user.email || "").trim().toLowerCase();

      if (!email.endsWith("@students.rfsd.k12.wi.us")) {
        window.location.replace("/index.html");
        return;
      }

      const name = user.displayName || "Wildcat";
      studentName.textContent = name;
      studentEmail.textContent = email;
      generateQrCode(user.uid);

      try {
        const studentRef = doc(db, "users", user.uid);
        const studentSnapshot = await getDoc(studentRef);

        if (!studentSnapshot.exists()) {
          await setDoc(studentRef, {
            uid: user.uid,
            displayName: name,
            email: email,
            bucks: 0,
            eventsAttended: 0,
            checkedInEvents: [],
            createdAt: new Date()
          });
        } else {
          await setDoc(studentRef, {
            uid: user.uid,
            displayName: name,
            email: email
          }, { merge: true });
        }
      } catch (error) {
        console.error("Firestore error:", error);
        showError("Your QR code loaded, but your student profile could not be synced.");
      }
    });

    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    document.addEventListener('dblclick', function(e) {
      e.preventDefault();
    });
  </script>

</body>

</html>
