<!DOCTYPE html>

    <style>

        body {
            background: #f6f7fb;

        .checkin-content {

        .qr-container {
            width: min(500px, calc(100vw - 40px));
            aspect-ratio: 1 / 1;

            background: #fff;

            box-shadow: 0 2px 12px rgba(0, 0, 0, .05);

            object-fit: contain;

            border-radius: 14px;

            font-size: .85rem;
        }

        .qr-label {
            margin-top: 18px;

            text-align: center;

            max-width: 360px;
        }

        .loading {
            color: #777;

        .error {
            display: none;

            margin-top: 20px;
            padding: 12px 16px;

            background: #fff0f0;
            color: #c62828;

            border-radius: 12px;

        }

        .error.show {

        /* =========================

        .nav-bar {
            position: fixed;

            left: 0;

            height: calc(60px + env(safe-area-inset-bottom));

            padding-bottom:
                calc(env(safe-area-inset-bottom) - 12px);

</head>

<body>

    <h1>Check In</h1>

    <main class="checkin-content">

        <div class="qr-container">
            <img
                id="studentQr"
                alt="Your Wiley Bucks QR Code"
            >
        </div>

        <h2
            class="student-name"
            id="studentName"
        >
            Loading...
        </h2>

        <p
            class="student-email"
            id="studentEmail"
        >
            Loading...
        </p>

        <p class="qr-label">
            Show this QR code to an event administrator
            to check in and earn Wiley Bucks.
        </p>

        <div
            class="error"
            id="errorMessage"
        ></div>

    </main>

    <!-- =========================
         BOTTOM NAVIGATION
    ========================= -->

    <nav class="nav-bar">

        <a
            href="student.html"
            class="nav-item"
        >
            <span class="material-symbols-outlined">
                home
            </span>

            <span>
                Home
            </span>
        </a>

        <a
            href="shop.html"
            class="nav-item"
        >
            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <span>
                Shop
            </span>
        </a>

        <a
            href="checkin.html"
            class="nav-item active"
        >
            <span class="material-symbols-outlined">
                qr_code_scanner
            </span>

            <span>
                Check In
            </span>
        </a>

        <a
            href="leaderboard.html"
            class="nav-item"
        >
            <span class="material-symbols-outlined">
                leaderboard
            </span>

            <span>
                Leaderboard
            </span>
        </a>

        <a

        >
            <span class="material-symbols-outlined">
                person
            </span>

            </span>
        </a>

    </nav>

    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


        /* =========================
           FIREBASE CONFIG
        ========================= */

        const firebaseConfig = {
            apiKey:
                "AIzaSyDUS75R4BH3-3e603dNvlKxIJU2ThNOc1k",

            authDomain:
                "river-falls-athletics-76449.firebaseapp.com",

            projectId:
                "river-falls-athletics-76449",

            storageBucket:
                "river-falls-athletics-76449.firebasestorage.app",

            messagingSenderId:
                "493469404152",

            appId:
                "1:493469404152:web:d47d73b848931d38ebe40d",

            measurementId:
                "G-CLQX2GN19Y"
        };


        /* =========================
           INITIALIZE FIREBASE
        ========================= */

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        /* =========================
           DOM
        ========================= */

        const studentQr =
            document.getElementById("studentQr");

        const studentName =
            document.getElementById("studentName");

        const studentEmail =
            document.getElementById("studentEmail");

        const errorMessage =
            document.getElementById("errorMessage");


        /* =========================
           SHOW ERROR
        ========================= */

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add("show");
        }


        /* =========================
           CREATE QR CODE
        ========================= */

        function generateQrCode(uid) {

            /*
             * The Firebase UID is unique to the
             * student's Google account.
             *
             * We prefix it with WILEY:
             * 
             * WILEY:firebaseUserUid
             *
             * The admin scanner will read this value.
             */

            const qrData = `WILEY:${uid}`;

            const encodedData =
                encodeURIComponent(qrData);

            /*
             * QR Server generates the actual QR image.
             */

            const qrUrl =
                `https://api.qrserver.com/v1/create-qr-code/?size=800x800&margin=20&data=${encodedData}`;

            studentQr.src = qrUrl;

            studentQr.onerror = () => {
                showError(
                    "Unable to load your QR code. Please check your internet connection."
                );
            };
        }


        /* =========================
           AUTH STATE
        ========================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {
                    window.location.replace(
                        "/student.html"
                    );

                    return;
                }


                /* =========================
                   ONLY STUDENT ACCOUNTS
                ========================= */

                const email =
                    (user.email || "")
                        .trim()
                        .toLowerCase();

                if (
                    !email.endsWith(
                        "@students.rfsd.k12.wi.us"
                    )
                ) {

                    window.location.replace(
                        "/student.html"
                    );

                    return;
                }


                /* =========================
                   DISPLAY USER
                ========================= */

                const name =
                    user.displayName ||
                    "Wildcat";

                studentName.textContent =
                    name;

                studentEmail.textContent =
                    email;


                /* =========================
                   GENERATE UNIQUE QR
                ========================= */

                generateQrCode(user.uid);


                /* =========================
                   CREATE / UPDATE STUDENT
                   FIRESTORE RECORD
                ========================= */

                try {

                    const studentRef =
                        doc(
                            db,
                            "students",
                            user.uid
                        );

                    const studentSnapshot =
                        await getDoc(studentRef);


                    if (!studentSnapshot.exists()) {

                        await setDoc(
                            studentRef,
                            {
                                uid: user.uid,
                                name: name,
                                email: email,
                                bucks: 0,
                                eventsAttended: 0,
                                createdAt: new Date()
                            }
                        );

                    } else {

                        /*
                         * Keep the student's profile
                         * information current.
                         */

                        await setDoc(
                            studentRef,
                            {
                                uid: user.uid,
                                name: name,
                                email: email
                            },
                            {
                                merge: true
                            }
                        );
                    }

                } catch (error) {

                    console.error(
                        "Firestore error:",
                        error
                    );

                    showError(
                        "Your QR code loaded, but your student profile could not be synced."
                    );
                }

            }
        );

    </script>

</body>
</html>
