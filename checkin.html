<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wiley Bucks</title>

    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter,sans-serif;
        }

        body{
            background:#f6f7fb;
            color:#222;
            min-height:100vh;
            padding:32px 20px calc(90px + env(safe-area-inset-bottom));
        }

        h1{
            font-size:28px;
            margin-bottom:24px;
        }

        .qr-container{
            width:calc(100vw - 40px);
            height:calc(100vw - 40px);
            max-width:500px;
            max-height:500px;

            background:white;
            padding:10px;
            border-radius:32px;

            display:flex;
            justify-content:center;
            align-items:center;

            margin:0 auto;
            box-shadow:0 2px 12px rgba(0,0,0,.05);
        }

        .qr-container img{
            width:100%;
            height:100%;
            object-fit:contain;
            border-radius:20px;
        }

        h2 {
            text-align: center;
            margin-top: 16px;
        }

        .nav-bar{
            position:fixed;
            left:0;
            right:0;
            bottom:0;

            height:calc(60px + env(safe-area-inset-bottom));
            padding-bottom:calc(env(safe-area-inset-bottom) - 12px);

            background:#fff;
            border-top:1px solid #e9e9e9;

            display:flex;
            justify-content:space-around;
            align-items:center;

            box-shadow:0 -2px 12px rgba(0,0,0,.06);
        }

        .nav-item{
            flex:1;
            height:72px;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:2px;

            text-decoration:none;
            color:#777;
        }

        .nav-item:hover,
        .nav-item.active{
            color:#5B2D90;
        }

        .nav-item .material-symbols-outlined{
            font-size:24px;
        }

        .nav-item span:last-child{
            font-size:.72rem;
            font-weight:600;
        }
    </style>
</head>

<body>

    <h1>Check In</h1>

    <div class="qr-container">
        <img src="https://support.thinkific.com/hc/article_attachments/360042081334/5d37325ea1ff6.png" alt="QR Code">
    </div>

    <h2>{name}</h2>

    <nav class="nav-bar">
        <a href="student.html" class="nav-item" onclick="navigate(event,'student.html')">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>

        <a href="shop.html" class="nav-item" onclick="navigate(event,'shop.html')">
            <span class="material-symbols-outlined">shopping_bag</span>
            <span>Shop</span>
        </a>

        <a href="checkin.html" class="nav-item active" onclick="navigate(event,'checkin.html')">
            <span class="material-symbols-outlined">qr_code_scanner</span>
            <span>Check In</span>
        </a>

        <a href="leaderboard.html" class="nav-item" onclick="navigate(event,'leaderboard.html')">
            <span class="material-symbols-outlined">leaderboard</span>
            <span>Leaderboard</span>
        </a>

        <a href="account.html" class="nav-item" onclick="navigate(event,'account.html')">
            <span class="material-symbols-outlined">person</span>
            <span>Account</span>
        </a>
    </nav>

    <script>
        function navigate(event, page){
            event.preventDefault();
            window.location.href = page;
        }
    </script>
<script type="module" src="/auth.js"></script>
</body>
</html>
