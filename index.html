<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiley Bucks</title>
    <link rel="manifest" href="/manifest.json">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            background: #f8f9fb;
            color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
            background: white;
            padding: 40px 32px;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 14px;
        }

        .subtitle {
            color: #666;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #0f62fe;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #004ed0;
        }

        .footer {
            margin-top: 18px;
            font-size: .9rem;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to Wiley Bucks</h1>

    <p class="subtitle">
        Attend school events, show your Wildcat pride, earn Wiley Bucks,
        and redeem rewards along the way.
    </p>

    <button>Sign in with Google</button>

    <p class="footer">
        Sign in using your River Falls student Google account.
    </p>
</div>

</body>
</html>
