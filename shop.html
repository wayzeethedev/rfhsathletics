<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wiley Bucks</title>

    <link rel="manifest" href="manifest.json">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter,sans-serif;
        }

        body{
            background:#f6f7fb;
            color:#222;
            min-height:100vh;
            padding:32px 20px calc(90px + env(safe-area-inset-bottom));
        }

        h1{
            font-size:28px;
            margin-bottom:4px;
        }

        .subtitle{
            color:#666;
            margin-bottom:24px;
        }

        .stat-container{
            display:flex;
            gap:12px;
            margin-bottom:28px;
        }

        .stat-box{
            flex:1 1 0;
            min-width:0;

            background:#fff;
            border-radius:16px;
            padding:18px 12px;

            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;

            text-align:center;

            box-shadow:0 2px 12px rgba(0,0,0,.05);
        }

        .stat-box h2{
            height:36px;
            display:flex;
            align-items:center;
            justify-content:center;

            font-size:1.5rem;
            font-weight:700;
            margin-bottom:2px;
        }

        .stat-box p{
            height:24px;
            display:flex;
            align-items:center;
            justify-content:center;

            font-size:.8rem;
            color:#777;
            line-height:1.2;
        }

        h3{
            font-size:20px;
            margin-bottom:14px;
        }

        .event-card{
            background:#fff;
            border-radius:16px;
            padding:16px;

            box-shadow:0 2px 12px rgba(0,0,0,.05);
            margin-bottom:12px;
        }

        .event-header{
            display:flex;
            justify-content:space-between;
            align-items:flex-start;
            margin-bottom:10px;
        }

        .event-title{
            font-size:16px;
            font-weight:700;
        }

        .event-matchup{
            color:#666;
            font-size:.85rem;
            margin-top:3px;
        }

        .event-points{
            color:#5B2D90;
            font-weight:700;
            font-size:.85rem;
            white-space:nowrap;
        }

        .event-info{
            color:#777;
            font-size:.85rem;
            line-height:1.5;
        }

        .nav-bar{
            position:fixed;
            left:0;
            right:0;
            bottom:0;

            height:calc(60px + env(safe-area-inset-bottom));
            padding-bottom:calc(env(safe-area-inset-bottom) - 12px);

            background:#fff;
            border-top:1px solid #e9e9e9;

            display:flex;
            justify-content:space-around;
            align-items:center;

            box-shadow:0 -2px 12px rgba(0,0,0,.06);
        }

        .nav-item{
            flex:1;
            height:72px;

            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            gap:2px;

            text-decoration:none;
            color:#777;
        }

        .nav-item:hover,
        .nav-item.active{
            color:#5B2D90;
        }

        .nav-item .material-symbols-outlined{
            font-size:24px;
        }

        .nav-item span:last-child{
            font-size:.72rem;
            font-weight:600;
        }
    </style>
</head>

<body>

    <h1>Rewards are not currently available.</h1>
    <p class="subtitle">Please check back later!</p>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item" onclick="navigate(event,'index.html')">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>

        <a href="shop.html" class="nav-item active" onclick="navigate(event,'shop.html')">
            <span class="material-symbols-outlined">shopping_bag</span>
            <span>Shop</span>
        </a>

        <a href="checkin.html" class="nav-item" onclick="navigate(event,'checkin.html')">
            <span class="material-symbols-outlined">qr_code_scanner</span>
            <span>Check In</span>
        </a>

        <a href="leaderboard.html" class="nav-item" onclick="navigate(event,'leaderboard.html')">
            <span class="material-symbols-outlined">leaderboard</span>
            <span>Leaderboard</span>
        </a>

        <a href="account.html" class="nav-item" onclick="navigate(event,'account.html')">
            <span class="material-symbols-outlined">person</span>
            <span>Account</span>
        </a>
    </nav>

    <script>
        function navigate(event, page){
            event.preventDefault();
            window.location.href = page;
        }
    </script>
<script type="module" src="/auth.js"></script>
</body>
</html>
